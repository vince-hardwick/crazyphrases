name: Deploy dev

on:
  push:
    branches:
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "chore/**"
    paths:
      - ".htaccess"
      - "index.html"
      - "assets/**"
  workflow_dispatch:
    inputs:
      ftps_preflight_only:
        description: Run strict FTPS preflight against dev without deploying.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect-deployment-surface:
    name: Detect deployment-relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
    steps:
      - &runner-security
        name: Verify runner security before JavaScript actions
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # JavaScript actions use the runner's executable, not the Node selected on PATH.
          pid="$PPID"
          runner_node=""
          while [[ "$pid" -gt 1 ]]; do
            executable="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            if [[ "${executable##*/}" == "Runner.Worker" ]]; then
              runner_node="$(dirname "$(dirname "$executable")")/externals/node24/bin/node"
              break
            fi
            pid="$(ps -o ppid= -p "$pid" | tr -d ' ')"
            [[ "$pid" =~ ^[0-9]+$ ]] || break
          done
          if [[ ! -x "$runner_node" ]]; then
            echo "::error::Cannot locate the active runner's Node 24 executable."
            exit 1
          fi

          version="$("$runner_node" --version)"
          printf 'Runner Node: %s (%s)\n' "$version" "$runner_node"
          if [[ ! "$version" =~ ^v24\.([0-9]+)\.([0-9]+)$ ]] ||
             (( BASH_REMATCH[1] < 22 || (BASH_REMATCH[1] == 22 && BASH_REMATCH[2] < 1) )); then
            echo "::error::JavaScript actions require Node 24.22.1 or later within 24.x."
            exit 1
          fi

          # An HTTP success from these incident test hosts means distrust is missing.
          # Only curl's certificate-validation error counts; DNS/timeouts do not.
          for host in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            result=0
            curl -q --head --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 "https://$host/" || result=$?
            printf 'curl certificate probe: %s exit=%s\n' "$host" "$result"
            if [[ "$result" != 60 ]]; then
              echo "::error::curl did not reject $host for a certificate-validation reason."
              exit 1
            fi
          done
          if ! curl -q --head --silent --show-error --output /dev/null --connect-timeout 10 --max-time 20 https://nodejs.org/; then
            echo "::error::curl could not validate the valid HTTPS control."
            exit 1
          fi


          "$runner_node" --input-type=module <<'NODE'
          import https from 'node:https';
          const revoked = new Set(['CERT_REVOKED', 'UNABLE_TO_GET_ISSUER_CERT_LOCALLY', 'UNABLE_TO_VERIFY_LEAF_SIGNATURE', 'CERT_UNTRUSTED']);
          const hosts = ['dv-g3b-emudhra.we-have-a-problem.com', 'dv-g3b-aaa-emudhra.we-have-a-problem.com', 'nodejs.org'];
          let failed = false;
          for (const host of hosts) {
            const result = await new Promise(resolve => {
              const request = https.get({ hostname: host, method: 'HEAD', timeout: 20000 }, response => {
                response.resume();
                resolve('accepted');
              });
              request.on('timeout', () => request.destroy(new Error('timeout')));
              request.on('error', error => resolve(error.code || error.message));
            });
            console.log(`Runner Node certificate probe: ${host} ${result}`);
            if (host === 'nodejs.org' ? result !== 'accepted' : !revoked.has(result)) failed = true;
          }
          if (failed) {
            console.error('::error::Runner Node certificate validation failed the security probes.');
            process.exitCode = 1;
          }
          NODE

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect hosted static runtime changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            if ! base="$(git merge-base "$head" "origin/${{ github.event.repository.default_branch }}")"; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git diff --name-only "$base" "$head" -- .htaccess index.html assets | grep -q .; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Deploy dev / Verify static site
    needs: detect-deployment-surface
    if: ${{ needs.detect-deployment-surface.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.ftps_preflight_only != true) }}
    runs-on: ubuntu-latest
    steps:
      - *runner-security

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ">=24.22.1 <25"

      - name: Verify site
        uses: ./.github/actions/verify-static-site

  deploy-dev:
    name: Deploy branch to dev
    if: ${{ needs.detect-deployment-surface.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.ftps_preflight_only != true) }}
    needs:
      - detect-deployment-surface
      - verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
      url: https://dev.crazyphrases.com/
    steps:
      - *runner-security

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Render Supabase runtime config
        uses: ./.github/actions/render-supabase-runtime-config
        with:
          url: ${{ vars.SUPABASE_URL }}
          publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/*.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .npmrc
            .gitattributes
            .gitignore
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            supabase/**
            tests/**

  preflight-dev:
    name: Verify dev FTPS target
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ftps_preflight_only == true }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
      url: https://dev.crazyphrases.com/
    steps:
      - *runner-security

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
