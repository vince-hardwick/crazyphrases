name: Deploy website

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - production
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required files exist
        run: |
          test -f index.html
          test -f assets/site.css

      - name: Check for insecure asset references
        run: |
          ! grep -R "http://" index.html assets

  deploy-manual:
    name: Deploy to selected environment
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.event.inputs.target_environment }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            docs/**

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            docs/**
