name: FTPS preflight

on:
  workflow_dispatch:
    inputs:
      target:
        description: Run strict FTPS target verification without deploying
        required: true
        default: all
        type: choice
        options:
          - test
          - production
          - all

permissions:
  contents: read

jobs:
  preflight-test:
    name: Verify test FTPS target
    if: ${{ inputs.target == 'test' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ftps-preflight-test
      cancel-in-progress: false
    environment:
      name: test
      url: https://test.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

  preflight-production:
    name: Verify production FTPS target
    if: ${{ inputs.target == 'production' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ftps-preflight-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
