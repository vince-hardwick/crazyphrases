name: Promote website

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitattributes"
      - ".github/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "README.md"
      - "docs/**"
      - "output/**"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      promote_production:
        description: Request production deployment after the test deployment completes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Promote website / Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify site
        uses: ./.github/actions/verify-static-site

  deploy-test:
    name: Deploy main to test
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: https://test.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Render Supabase runtime config
        uses: ./.github/actions/render-supabase-runtime-config
        with:
          url: ${{ vars.SUPABASE_URL }}
          publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/*.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .gitattributes
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            supabase/**
            tests/**

  deploy-production:
    name: Deploy main to production
    if: ${{ github.event_name == 'push' || inputs.promote_production == true }}
    needs: deploy-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Render Supabase runtime config
        uses: ./.github/actions/render-supabase-runtime-config
        with:
          url: ${{ vars.SUPABASE_URL }}
          publishable-key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/*.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .gitattributes
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            supabase/**
            tests/**
