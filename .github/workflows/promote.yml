name: Promote website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote_production:
        description: Request production deployment after the test deployment completes
        required: true
        default: false
        type: boolean
      ftps_preflight_target:
        description: Run strict FTPS preflight without deploying
        required: true
        default: none
        type: choice
        options:
          - none
          - test
          - production
          - all

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ftps_preflight_target == 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify site
        uses: ./.github/actions/verify-static-site

  deploy-test:
    name: Deploy main to test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ftps_preflight_target == 'none' }}
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: https://test.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/*.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            supabase/**
            tests/**

  deploy-production:
    name: Deploy main to production
    if: ${{ github.event_name == 'push' || (inputs.promote_production == true && inputs.ftps_preflight_target == 'none') }}
    needs: deploy-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/*.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            supabase/**
            tests/**

  preflight-test:
    name: Verify test FTPS target
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ftps_preflight_target == 'test' || inputs.ftps_preflight_target == 'all') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: https://test.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

  preflight-production:
    name: Verify production FTPS target
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ftps_preflight_target == 'production' || inputs.ftps_preflight_target == 'all') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify strict FTPS deploy target
        uses: ./.github/actions/verify-ftps-deploy-target
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
