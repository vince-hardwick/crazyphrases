name: Promote website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote_production:
        description: Request production deployment after the test deployment completes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify site
        uses: ./.github/actions/verify-static-site

  deploy-test:
    name: Deploy main to test
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment:
      name: test
      url: https://test.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/app.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            tests/**

  deploy-production:
    name: Deploy main to production
    if: github.event_name == 'push' || inputs.promote_production == true
    needs: deploy-test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.crazyphrases.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stamp static asset version
        shell: bash
        run: |
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" index.html
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" assets/app.js

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            AGENTS.md
            CONTEXT.md
            README.md
            docs/**
            output/**
            package.json
            package-lock.json
            tests/**
